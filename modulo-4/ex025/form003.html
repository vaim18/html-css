<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <form action="cadastro.php" method="post" autocomplete="on">
        <P>
            <label for="inome">Nome:</label>
            <input type="text" name="nome" id="inome" required maxlength="30" placeholder="Nome Completo" autocomplete="name">
        </P>
        <P>
            <label for="imedia">Média:</label> 
            <input type="number" name="media" id="imedia" min="0" max="10" placeholder="0 a 10" step="0.1"  value="5" required>
        </P>
        <P>
            <label for="imes">Período Letivo:</label>
            <input type="month" name="mes" id="imes">
        </P>
        <p>
            <label for="idia">Dia da Prova:</label>
            <input type="date" name="dia" id="idia">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
    <script>
        //Seleciona o input no formulário
        const idia = document.getElementById('idia');

        //Cria um objeto da data
        const dataAtual = new Date();

        //Ajusta o timezone local para envitar erros com o dia anterior
        const offset = dataAtual.getTimezoneOffset() * 60000;
        const dataLocal = new Date(dataAtual.getTime() - offset);

        //Formata a data para o padrão yyyy-mm-dd
        const dataFormatada = dataLocal.toISOString().slice(0, 10);

        //Define o valor do formulário
        dataInput.value = dataFormatada;
    </script>
</body>
</html>
