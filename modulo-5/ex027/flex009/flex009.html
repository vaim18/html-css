<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;

            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 150px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="i1">Lorem ipsum dolor sit amet consectetur, adipisicing elit.</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Doloremque fugiat, eveniet saepe soluta repellat quo omnis quibusdam aliquam quod eligendi qui earum! Neque nihil ipsum ratione deleniti iure quis aspernatur.</div>
        <div class="item" id="i7">G</div>
    </div>
</body>
</html>
